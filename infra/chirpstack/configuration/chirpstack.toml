# ChirpStack v4 — Hauptkonfiguration (lokale Entwicklung)
# Quelle: https://www.chirpstack.io/docs/chirpstack/configuration.html

[logging]
  level = "info"
  json = false

[postgresql]
  # ${VAR}-Platzhalter werden vom chirpstack-init-Sidecar (envsubst) zur
  # Container-Start-Zeit expandiert, BEVOR ChirpStack die Config liest.
  dsn = "${POSTGRES_DSN}"
  max_open_connections = 10
  min_idle_connections = 0

[redis]
  servers = ["redis://redis:6379/1"]
  cluster = false
  key_prefix = "cs:"

[network]
  net_id = "000000"
  enabled_regions = ["eu868"]

  # **Wieder verdrahtet am 16.11.2026**, nachdem die Form belegt ist.
  #
  # Der Eintrag stand ab #406 hier und hat ChirpStack 4.17 beim Start
  # abbrechen lassen (``Get id function: JS error``), weil die Datei
  # Funktionen auf oberster Ebene hatte statt benannter ES-Exporte. Von
  # 08:53 bis 09:00 hat die Anlage nichts verarbeitet, und 54 gruene
  # Tests hatten die falsche Umgebung geprueft (Paragraph 5.55).
  #
  # Was sich seither geaendert hat, und nur deshalb steht der Eintrag
  # wieder hier: die Datei traegt ``export function id/name/handle``,
  # und ein Test laesst chirpstack/chirpstack:4.17.0 -- dasselbe Image
  # wie am Server -- gegen eine Wegwerf-Datenbank laufen. Er prueft
  # beides: dass diese Fassung laedt, und dass die Fassung vom 15.11.
  # ohne ``export`` mit genau der damaligen Meldung abbricht.
  # ``infra/chirpstack/tests/test_adr_plugins.py``.
  #
  # Der Pfad zeigt in das Verzeichnis, das der Init-Sidecar mit
  # ``cp -r /template/adr-plugins /output/`` in das Volume legt. Ohne
  # diese Zeile in docker-compose.prod.yml liegt die Datei nicht im
  # Container, und ChirpStack meldet dazu nichts Aussagekraeftiges.
  adr_plugins = ["/etc/chirpstack/adr-plugins/relais-feste-datenrate.js"]

[api]
  bind = "0.0.0.0:8080"
  secret = "${CHIRPSTACK_API_SECRET}"

[gateway]
  client_cert_lifetime = "12months"

[integration]
  enabled = ["mqtt"]

[integration.mqtt]
  event_topic = "application/{{application_id}}/device/{{dev_eui}}/event/{{event}}"
  command_topic = "application/{{application_id}}/device/{{dev_eui}}/command/{{command}}"
  json = true
  server = "tcp://mosquitto:1883"
  username = "${MQTT_CHIRPSTACK_USER}"
  password = "${MQTT_CHIRPSTACK_PASSWORD}"
  qos = 1
  clean_session = true
  client_id = "chirpstack-integration"

[monitoring]
  bind = "0.0.0.0:8081"
