# ChirpStack v4 — Hauptkonfiguration (lokale Entwicklung)
# Quelle: https://www.chirpstack.io/docs/chirpstack/configuration.html

[logging]
  level = "info"
  json = false

[postgresql]
  # ${VAR}-Platzhalter werden vom chirpstack-init-Sidecar (envsubst) zur
  # Container-Start-Zeit expandiert, BEVOR ChirpStack die Config liest.
  dsn = "${POSTGRES_DSN}"
  max_open_connections = 10
  min_idle_connections = 0

[redis]
  servers = ["redis://redis:6379/1"]
  cluster = false
  key_prefix = "cs:"

[network]
  net_id = "000000"
  enabled_regions = ["eu868"]

  # ADR-Plugins (16.11.2026). Zugewiesen werden sie **je Geraeteprofil**
  # ueber adr_algorithm_id; hier stehen sie nur zur Verfuegung. Ein Profil,
  # das keines nennt, bleibt beim Standard-Algorithmus.
  #
  # Die Begruendung steht im Kopf der jeweiligen Datei:
  #   relais-feste-datenrate.js  DR1, nbTrans 2, volle Leistung
  #                              (108 verlor am 12.11. 16 % bei DR3)
  #   vicki-feste-leistung.js    volle Leistung, Datenrate adaptiv
  #                              (056 war 14 h stumm bei ca. 2 dBm)
  #
  # **Der Pfad muss zum Init-Sidecar passen.** Er kopiert das Verzeichnis
  # nach /output, und ChirpStack sieht /output als /etc/chirpstack. Ohne
  # die Kopierzeile in docker-compose.prod.yml steht der Pfad hier und die
  # Datei ist im Container nicht da -- und ChirpStack sagt dazu nichts
  # Aussagekraeftiges.
  adr_plugins = [
    "/etc/chirpstack/adr-plugins/relais-feste-datenrate.js",
    "/etc/chirpstack/adr-plugins/vicki-feste-leistung.js",
  ]

[api]
  bind = "0.0.0.0:8080"
  secret = "${CHIRPSTACK_API_SECRET}"

[gateway]
  client_cert_lifetime = "12months"

[integration]
  enabled = ["mqtt"]

[integration.mqtt]
  event_topic = "application/{{application_id}}/device/{{dev_eui}}/event/{{event}}"
  command_topic = "application/{{application_id}}/device/{{dev_eui}}/command/{{command}}"
  json = true
  server = "tcp://mosquitto:1883"
  username = "${MQTT_CHIRPSTACK_USER}"
  password = "${MQTT_CHIRPSTACK_PASSWORD}"
  qos = 1
  clean_session = true
  client_id = "chirpstack-integration"

[monitoring]
  bind = "0.0.0.0:8081"
