# ChirpStack v4 — EU868-Region (Europa-Frequenzplan)
# Quelle: https://www.chirpstack.io/docs/chirpstack/configuration/region-eu868.html
# Format: ChirpStack v4.5+ (gateway.backend als Struct, nicht String).

[[regions]]
  name = "eu868"
  description = "EU868"
  common_name = "EU868"
  user_info = "EU868 Frequenzplan, vorbereitet fuer Hotel Sonnblick"

  [regions.network]
    # **Die SNR-Reserve, auf die ADR hinoptimiert — am 16.11.2026 von 10
    # auf 20 dB erhoeht.**
    #
    # Der Standard-Algorithmus rechnet (chirpstack/src/adr/default.rs):
    #
    #     snr_margin = snr_max - required_snr_for_dr - installation_margin
    #     n_step     = (snr_margin / 3.0) as isize
    #
    # n_step > 0 erhoeht die Datenrate, und wenn die schon am Anschlag
    # ist, **senkt es die Sendeleistung**. Im Gleichgewicht gilt also
    # ``snr_max ~ required_snr_for_dr + installation_margin``: bei DR5
    # (SF7, required -7,5) waren das mit 10 dB ein Ziel-SNR von **+2,5
    # dB**. Das ist die Reserve, mit der 90 von 109 Geraeten auf
    # tx_power_index 7 (ca. 2 dBm) standen.
    #
    # **Der Anlass:** Fuehler 056 war am 12./13.11.2026 von 14:41 bis
    # 04:44 stumm -- vierzehn Stunden, 83 verlorene Frames, am selben
    # Platz. Nach der Korrektur auf Index 1 verbesserte sich RSSI von
    # -113 auf -104 dBm und SNR von -0,2 auf +8,2 dB. Neun dB, allein aus
    # der Leistung.
    #
    # Mit 20 dB liegt das Ziel bei **+12,5 dB**. Gerechnet auf die
    # Messwerte vom 13.11. (hoechster SNR der letzten 20 Meldungen je
    # Geraet): **kein** Geraet hat dann noch Spielraum nach unten, 70
    # bleiben wie sie sind, 33 bekommen Leistung zurueck. Keines verliert
    # etwas.
    #
    # **Was es nicht behebt:** die Datenrate. Der Algorithmus senkt sie
    # nie (nur eine Klammer bei ``dr > max_dr``). Relais 108 bleibt
    # deshalb auf DR3 eingeklemmt, und dafuer gibt es das ADR-Plugin.
    installation_margin = 20.0
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 0
    rx2_frequency = 869525000
    gateway_prefer_min_margin = 10.0
    downlink_tx_power = -1
    adr_disabled = false
    min_dr = 0
    max_dr = 5
    uplink_max_eirp = 16.0
    enabled_uplink_channels = []

    [regions.network.class_b]
      ping_slot_dr = 3
      ping_slot_frequency = 868100000

  [regions.gateway]
    [regions.gateway.backend]
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]
        event_topic = "eu868/gateway/+/event/+"
        command_topic = "eu868/gateway/{{ gateway_id }}/command/{{ command }}"
        server = "tcp://mosquitto:1883"
        username = "${MQTT_CHIRPSTACK_USER}"
        password = "${MQTT_CHIRPSTACK_PASSWORD}"
        qos = 1
        clean_session = true
        client_id = "chirpstack-gw-eu868"
