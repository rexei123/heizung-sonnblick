# Produktions-Compose (Pull-basiert)
#
# Zieht fertige Images aus GHCR statt lokal zu bauen.
# Kein docker build auf den Prod-Hosts mehr.
#
# Gesteuert über .env im selben Verzeichnis:
#   STAGE=test|main              -> wählt Caddyfile
#   IMAGE_TAG=develop|main|<sha> -> wählt Image-Version
#   PUBLIC_HOSTNAME=…            -> Caddy + Frontend (heizung-test.hoteltec.at / heizung.hoteltec.at)
#   CHIRPSTACK_HOSTNAME=…        -> Caddy-Subdomain für ChirpStack-UI (cs-test.hoteltec.at, nur Test)
#   CHIRPSTACK_BASIC_AUTH_HASH   -> bcrypt-Hash für ChirpStack-UI-Login
#   POSTGRES_*                   -> Heizung-DB-Credentials
#   CHIRPSTACK_DB_PASSWORD       -> ChirpStack-DB-Credentials
#   MQTT_CHIRPSTACK_PASSWORD     -> Mosquitto-User chirpstack (publish)
#   MQTT_HEIZUNG_PASSWORD        -> Mosquitto-User heizung-api (subscribe)
#
# Aktualisierung: deploy-pull.sh (siehe Nachbardatei).

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    # Sprint 6.6.4: Production-Konfig mit Auth (passwd + ACL) statt
    # anonymous. Drei User: chirpstack, gateway-ug65, heizung-api.
    # Setup-Anleitung: RUNBOOK Abschnitt "MQTT-Auth-Setup".
    command: mosquitto -c /mosquitto/config/mosquitto.prod.conf
    volumes:
      - ../mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # Sprint 6 Pairing: Port 1883 oeffentlich, damit UG65 (ChirpStack-v4-Modus)
    # direkt MQTT publishen kann. Auth via passwd+ACL aktiv (Sprint 6.6.4).
    ports:
      - "1883:1883"
    expose:
      - "1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u heizung-api -P ${MQTT_HEIZUNG_PASSWORD} -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  chirpstack-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: chirpstack
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
    volumes:
      - chirpstack_db:/var/lib/postgresql/data
      - ../chirpstack/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Init-Sidecar: rendert chirpstack.toml mit envsubst (expandiert ${VAR}-Platzhalter)
  # in ein gemeinsames Named Volume. Laeuft einmalig vor chirpstack.
  chirpstack-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    environment:
      POSTGRES_DSN: "postgres://chirpstack:${CHIRPSTACK_DB_PASSWORD}@chirpstack-postgres:5432/chirpstack?sslmode=disable"
      MQTT_CHIRPSTACK_USER: chirpstack
      MQTT_CHIRPSTACK_PASSWORD: ${MQTT_CHIRPSTACK_PASSWORD}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
    volumes:
      - ../chirpstack/configuration:/template:ro
      - chirpstack_config_rendered:/output
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache gettext > /dev/null
        envsubst < /template/chirpstack.toml > /output/chirpstack.toml
        # Sprint 6.6.4: region_eu868.toml braucht jetzt envsubst, weil
        # MQTT_CHIRPSTACK_USER/PASSWORD in [regions.gateway.backend.mqtt]
        # fuer Auth gegen Mosquitto.
        envsubst < /template/region_eu868.toml > /output/region_eu868.toml
        echo "chirpstack-init: rendered configs to /output"
        ls -la /output/

  # Init-Sidecar fuer chirpstack-gateway-bridge: rendert dessen TOML.
  chirpstack-gateway-bridge-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    environment:
      MQTT_GATEWAY_BRIDGE_USER: ${MQTT_GATEWAY_BRIDGE_USER:-}
      MQTT_GATEWAY_BRIDGE_PASSWORD: ${MQTT_GATEWAY_BRIDGE_PASSWORD:-}
    volumes:
      - ../chirpstack-gateway-bridge:/template:ro
      - gateway_bridge_config_rendered:/output
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache gettext > /dev/null
        envsubst < /template/chirpstack-gateway-bridge.toml > /output/chirpstack-gateway-bridge.toml
        echo "gateway-bridge-init: rendered config"
        ls -la /output/

  # Basic-Station-Endpoint fuer das UG65-Gateway. Caddy macht WSS-Termination
  # davor (cs-test.hoteltec.at /router-*), Bridge selbst spricht WS intern.
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: always
    user: "0:0"
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
    volumes:
      - gateway_bridge_config_rendered:/etc/chirpstack-gateway-bridge:ro
    depends_on:
      chirpstack-gateway-bridge-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    expose:
      - "3001"

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: always
    # Container nur internes Docker-Netz, kein Public-Port; Caddy davor.
    user: "0:0"
    command: -c /etc/chirpstack
    volumes:
      - chirpstack_config_rendered:/etc/chirpstack:ro
    depends_on:
      chirpstack-init:
        condition: service_completed_successfully
      chirpstack-postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - "8080"
      - "8081"

  api:
    image: ghcr.io/rexei123/heizung-api:${IMAGE_TAG:-develop}
    pull_policy: always
    restart: always
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: heizung-api
      MQTT_PASSWORD: ${MQTT_HEIZUNG_PASSWORD}
      # Sprint 9.1: API ruft evaluate_room.delay() ab Sprint 9.4 auf.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    # Kein Port-Mapping nach außen — nur Caddy spricht mit der API.
    expose:
      - "8000"

  # Sprint 9.1 — Celery-Worker fuer die Regel-Engine.
  # Gleiches Image wie api (gleiche Codebasis), anderes Command.
  # concurrency=2 wegen CPX22-RAM (Brief 2026-05-03 §9 Risiko 3).
  celery_worker:
    image: ghcr.io/rexei123/heizung-api:${IMAGE_TAG:-develop}
    pull_policy: always
    restart: always
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: heizung-api
      MQTT_PASSWORD: ${MQTT_HEIZUNG_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      # Worker macht keinen MQTT-Subscribe (das ist api-Container).
      MQTT_ENABLED: "false"
    command:
      - celery
      - -A
      - heizung.celery_app
      - worker
      - --concurrency=2
      - --loglevel=info
      - --queues=heizung_default
      - --hostname=worker@%h
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      # `celery inspect ping` schickt ping ueber Broker. Wenn Worker
      # keine Antwort liefert, restart. -t 5 = Timeout in s.
      test: ["CMD", "celery", "-A", "heizung.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Sprint 9.7 — Celery-Beat Scheduler.
  # Trigger ``evaluate_due_rooms`` alle 60 s (siehe celery_app.beat_schedule).
  # Genau EIN beat-Container — sonst doppelte Triggers bei N Replicas.
  celery_beat:
    image: ghcr.io/rexei123/heizung-api:${IMAGE_TAG:-develop}
    pull_policy: always
    restart: always
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MQTT_ENABLED: "false"
    command:
      - celery
      - -A
      - heizung.celery_app
      - beat
      - --loglevel=info
      # Schedule im File (Default: celerybeat-schedule), persistiert
      # zuletzt-getriggerte Zeitpunkte ueber Container-Restarts.
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    # Eigener Healthcheck, sonst erbt dieser Container den aus dem Dockerfile
    # (`curl -f http://localhost:8000/health`, backend/Dockerfile:44-45). Beat
    # fuehrt keinen uvicorn — der Check kann nur scheitern, und der Container
    # stand deshalb dauerhaft auf `unhealthy`, bei laufendem Beat (§5.32).
    #
    # Geprueft wird die WIRKUNG, nicht die Mechanik (§5.76): hat Beat seinen
    # Schedule in den letzten zehn Minuten geschrieben? Der PersistentScheduler
    # synchronisiert seine shelve-Datei beim Ticken (`sync_every`, Celery-intern
    # rund alle drei Minuten), und der 60-s-Task garantiert, dass getickt wird.
    # Ein toter Beat hinterlaesst also eine alternde Datei.
    #
    # Ein Prozess-Check (`pgrep -f "celery.*beat"`) waere die Mechanik: ein
    # haengender Beat-Prozess waere damit `healthy`. Ein `celery inspect ping`
    # geht ebenfalls nicht — Beat ist kein Worker und antwortet darauf nicht.
    #
    # DREI Details, die nicht offensichtlich sind:
    #
    # 1. `celerybeat-schedule*` als Muster, nicht als Pfad. `--schedule` gibt
    #    den Pfad an `shelve.open()`, und welche Datei daraus wird, entscheidet
    #    die zur Laufzeit verfuegbare dbm-Implementierung: `.db` bei gdbm,
    #    `.dir`/`.dat`/`.bak` bei `dbm.dumb`, oder der Name unveraendert. Ein
    #    Check auf den exakten Pfad kann dauerhaft rot stehen, weil die Datei
    #    so nie heisst — dasselbe Symptom wie vorher, nur mit neuer Ursache.
    #
    # 2. Zehn Minuten, nicht fuenf. Die Sync-Kadenz von rund drei Minuten ist
    #    ein Celery-interner Default, also genau die Sorte Zahl, die sich unter
    #    einer unfixierten Abhaengigkeit verschiebt (§5.80 — mypy, SQLAlchemy
    #    und Alembic haben das in acht Tagen dreimal vorgefuehrt). Zehn Minuten
    #    vertragen zwei ausgefallene Syncs und erkennen einen toten Beat
    #    trotzdem binnen zehn Minuten.
    #
    # 3. `python` statt `find`/`grep`. Die naheliegende Fassung waere
    #    `find /tmp -name 'celerybeat-schedule*' -newermt '-10 minutes' | grep -q .`
    #    — sie setzt aber voraus, dass findutils und grep im Image sind. Sie
    #    sind es sehr wahrscheinlich (Debian-Priority `required`), aber das
    #    ist Gedaechtnis und kein Befund; ein Healthcheck, der an einer
    #    fehlenden Binary scheitert, meldet `unhealthy` und sieht aus wie ein
    #    kaputter Beat. Python ist garantiert da — es IST das Image.
    #
    # `start_period` 120 s: der erste Sync kommt nicht sofort. Mit
    # `retries: 3` und `interval: 60s` dauert es fruehestens rund fuenf
    # Minuten bis `unhealthy` — lange genug, dass ein langsamer Start nicht
    # als Ausfall gemeldet wird.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import glob,os,sys,time; f=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if f and max(map(os.path.getmtime,f)) > time.time()-600 else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: ghcr.io/rexei123/heizung-web:${IMAGE_TAG:-develop}
    pull_policy: always
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_HOSTNAME}
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      CHIRPSTACK_HOSTNAME: ${CHIRPSTACK_HOSTNAME:-}
      CHIRPSTACK_BASIC_AUTH_HASH: ${CHIRPSTACK_BASIC_AUTH_HASH:-}
      # K-1 (Sprint 8a): Basic-Auth fuer /api/* + /openapi.json + /docs.
      # bcrypt-Hash, doppelte $$ in .env wegen Compose-Interpolation.
      HOTEL_BASIC_AUTH_HASH: ${HOTEL_BASIC_AUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.${STAGE}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
      - web

volumes:
  db_data:
  chirpstack_db:
  chirpstack_config_rendered:
  gateway_bridge_config_rendered:
  mosquitto_data:
  mosquitto_log:
  caddy_data:
  caddy_config:
  caddy_logs:
