[project]
name = "heizung"
version = "0.1.0"
description = "Heizungssteuerung Hotel Sonnblick"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    # Obergrenze bewusst gesetzt (27.09.2026). SQLAlchemy 2.1 hat seine
    # Typisierung geaendert: nullable Spalten kommen beim Row-Unpacking als
    # ``X | None`` bzw. ``object`` heraus, was sechs Meldungen in
    # Bestandscode erzeugt (CLAUDE.md 5.80, B-18-4). Der Sprung auf 2.1 ist
    # ein ORM-Minor-Update in einer async-Anwendung — das gehoert in einen
    # eigenen PR mit vollem Testlauf, nicht als Nebenwirkung eines Hotfix
    # ins Produktions-Image.
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "celery>=5.3",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "aiomqtt>=2.3",
    "greenlet>=3.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "freezegun>=1.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    # Obergrenze bewusst gesetzt (26.09.2026). mypy 2.x meldet vier Stellen
    # in Bestandscode, die 1.x durchgelassen hat. Der eigentliche Mangel war
    # aber nicht der Typfehler, sondern die fehlende Obergrenze: zwei Laeufe
    # desselben CI-Jobs, fuenf Stunden auseinander, verschiedene Ergebnisse,
    # ohne eine Zeile Code-Aenderung (PR #240 gruen um 05:0x UTC mit 1.x,
    # PR #241 rot um 10:13 UTC mit 2.3.1). Siehe CLAUDE.md 5.80.
    # Anpassung an mypy 2 als B-18-4 nach dem 29.09.
    "mypy>=1.9,<2",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Seed-CSVs als Package-Data ins Wheel/Image packen (Zimmer-Seed): der
# seed_rooms-Default-Pfad zeigt auf die eingebettete Datei -> Lauf ohne scp.
[tool.setuptools.package-data]
"heizung.scripts.seed_data" = ["*.csv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Sprint 9.8a: Celery liefert keine Type-Stubs fuer @app.task / @signal.connect-
# Decorators. Mypy meldet sonst untyped-decorator fuer alle Engine-Tasks. Das
# Modul-Override beschraenkt die Suppression auf die Celery-Andockpunkte.
[[tool.mypy.overrides]]
module = ["heizung.celery_app", "heizung.tasks.*"]
disable_error_code = ["untyped-decorator"]
