name: ChirpStack-Tools CI

# Sprint 17 (C1): infra/chirpstack/ liegt bewusst ausserhalb des Backend-
# Packages (D3 — chirpstack-api ist keine Abhaengigkeit des API-Images).
# backend-ci.yml arbeitet mit `working-directory: backend` und prueft nur
# `src tests` darunter — dieses Skript wuerde es nie erfassen. Eigener
# Workflow, gleiche Gates wie das Backend.

# Kein `paths`-Filter, gleiche Begruendung wie in backend-ci.yml:
# `chirpstack-lint-and-test` ist Pflicht-Check, und ein Pflicht-Check muss
# auf jedem PR ein Ergebnis melden. Der Lauf dauert rund 15 Sekunden.
on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: infra/chirpstack

jobs:
  # Eigener Job-Name, NICHT `lint-and-test`: backend-ci.yml hat einen Job
  # desselben Namens. Beide melden ihren Status unter dem Job-Namen, und
  # als Pflicht-Check waere `lint-and-test` dann von einem beliebigen der
  # beiden erfuellbar — ein PR, der nur infra/chirpstack aendert, haette
  # einen gruenen Check "Backend getestet", ohne dass ein Backend-Test lief.
  chirpstack-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sprint 23 T1b: der Codec-Test fuehrt `codecs/mclimate-vicki.js`
      # mit `node` aus, statt die Decoder-Logik in Python nachzubauen.
      #
      # Der Grund steht im Test: ein Python-Spiegel hat kein
      # `decodeUplink` und kann deshalb keinen **Routing**-Fehler finden.
      # Genau einer lag vom 25. bis 26.10.2026 vor — die 0x15-Antwort des
      # Geraets landete im falschen Zweig, und der Spiegel-Test war die
      # ganze Zeit gruen.
      #
      # Node ist auf den GitHub-Runnern vorinstalliert; der Schritt pinnt
      # die Fassung und macht die Abhaengigkeit sichtbar. Ohne ihn
      # uebersprang der Test sich im Zweifel selbst — und ein Test, der
      # sich still ueberspringt, ist kein Test (CLAUDE.md 5.81).
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        # Bewusst OHNE requirements-provision.txt: die Tests laufen gegen
        # einen Doppelgaenger des gRPC-Clients, nicht gegen chirpstack-api.
        # Das haelt die CI schnell und beweist nebenbei, dass der Import
        # wirklich lazy ist.
        #
        # Grenzen identisch zu backend/pyproject.toml. Dieser Schritt
        # installiert die Werkzeuge INLINE, der Pin dort greift hier also
        # nicht — am 26.09.2026 zog dieser Job weiterhin mypy 2, waehrend
        # backend-ci schon gepinnt war. Er blieb gruen, weil die
        # ChirpStack-Werkzeuge die betroffenen Stellen nicht haben: Glueck,
        # keine Absicht. Genau diese Werkzeuge pruefen die Skripte, die im
        # Montagefenster die Geraete anlegen (CLAUDE.md 5.80).
        run: pip install "ruff>=0.3" "mypy>=1.9,<2" "pytest>=8.0"

      - name: Ruff (Lint)
        run: ruff check .

      - name: Ruff (Format-Check)
        run: ruff format --check .

      - name: Mypy (Type-Check)
        # Ganzes Verzeichnis, nicht nur das Skript: sonst bleiben die Tests
        # ungeprueft, und gerade dort lebt der Doppelgaenger, der das
        # ChirpStack-Verhalten nachbildet.
        run: mypy .

      - name: Pytest
        run: pytest -q
