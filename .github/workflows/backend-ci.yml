name: Backend CI

# Kein `paths`-Filter: dieser Workflow laeuft auf JEDEM Pull-Request.
#
# Grund: `lint-and-test` ist Pflicht-Check auf develop und main. Ein
# Pflicht-Check, der wegen eines Pfadfilters gar nicht erst startet, bleibt
# dauerhaft auf "Expected — Waiting for status to be reported" stehen und
# blockiert den PR fuer immer — bei `enforce_admins: true` ohne Notbremse.
# Jeder Doku-PR waere betroffen.
#
# Die Alternative waere ein Skip-Spiegel nach dem Muster von
# frontend-ci-skip.yml. Bewusst verworfen: zwei Dateien, deren `paths` und
# `paths-ignore` synchron bleiben muessen, und ein `gh pr checks`, das nicht
# mehr erkennen laesst, welcher Workflow geantwortet hat (CLAUDE.md §5.55).
# Ein Pflicht-Check, der die Produktion schuetzen soll, darf nicht davon
# abhaengen, dass zwei Listen nicht auseinanderlaufen.
#
# Preis: rund 2m40s pro PR, der `backend/**` gar nicht beruehrt. Das ist
# billiger als eine Luecke im Gate — ab 29.09. deployt der Timer alle
# 5 Minuten automatisch.
on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: heizung
          POSTGRES_PASSWORD: heizung_test
          POSTGRES_DB: heizung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heizung"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (Lint)
        run: ruff check src tests

      - name: Ruff (Format-Check)
        run: ruff format --check src tests

      - name: Mypy (Type-Check)
        run: mypy src

      - name: Pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://heizung:heizung_test@localhost:5432/heizung_test
          # TEST_DATABASE_URL == DATABASE_URL: viele Tests nutzen TEST_DATABASE_URL
          # direkt fuer DB-Verbindung (engine_layer3/4, manual_override_model,
          # migrations_roundtrip). Eigene heizung_migration_test wuerde dann
          # nicht durch conftest._ensure_test_admin migriert werden.
          # test_migrations_roundtrip wipt/restored die DB innerhalb seines
          # Moduls — andere Module migrieren zu Beginn neu via _ensure_test_admin.
          TEST_DATABASE_URL: postgresql+asyncpg://heizung:heizung_test@localhost:5432/heizung_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-32chars
        run: pytest --cov=heizung --cov-report=term-missing
